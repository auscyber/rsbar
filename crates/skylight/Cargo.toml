[package]
name = "skylight"
description = "Bindings to the private SkyLight/CoreGraphics-Services window server APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bitflags = { workspace = true }
objc2 = { workspace = true }
skylight-macros = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder", "objc2-core-foundation", "libc"] }
objc2-application-services = { workspace = true, features = ["std", "HIServices", "AXError", "AXUIElement", "AXValue", "libc"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFDictionary", "CFNumber", "CFRunLoop", "CFString", "CFCGTypes", "CFUUID"] }
objc2-core-graphics = { workspace = true, features = ["CGError", "CGDirectDisplay", "CGDisplayConfiguration", "CGContext", "CGGeometry", "CGImage", "CGWindow", "libc"] }
objc2-quartz-core = { workspace = true, features = ["CALayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
# The `Stream` trait and nothing else -- no executor, no combinators, no
# runtime. `callback::Events` implements it so a source's future composes with
# whatever drives it.
futures-core = { workspace = true }
# `callback::relay`'s queue, and `connection`'s exclusive-use lock over the
# one window server connection. The workspace's feature set (`rt-multi-thread`
# included) comes along with `workspace = true`, which is what lets an example
# build a runtime to call the async entry points this crate now has.
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
objc2-core-foundation = { workspace = true, features = ["CFRunLoop"] }
objc2-core-graphics = { workspace = true, features = ["CGEvent", "CGEventTypes", "CGEventSource"] }
