[package]
name = "coolabah-protocol"
description = "Wire types shared by the coolabah daemon, CLI and Lua module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coolabah-protocol-macros = { workspace = true }
async-mach-ports = { workspace = true }
rmp-serde = "1.3"
bitflags = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
# A patch names a key it has no field for rather than dropping it in silence;
# that warning belongs to the type, so the type needs somewhere to put it.
tracing = { workspace = true }

# Only to keep proving, in `tests/untagged_probe.rs`, what the wire format was
# changed away from.
[dev-dependencies]
postcard = { version = "1.1", features = ["use-std"] }

[lints]
workspace = true
