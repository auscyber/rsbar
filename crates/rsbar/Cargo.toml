[package]
name = "rsbar"
description = "A configurable status bar for macOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rsbar"
path = "src/lib.rs"

[[bin]]
name = "rsbard"
path = "src/main.rs"

[dependencies]
rsbar-protocol = { workspace = true }
skylight = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFAttributedString", "CFDictionary", "CFNumber", "CFString", "CFCGTypes", "CFRunLoop"] }
objc2-core-graphics = { workspace = true, features = ["CGContext", "CGColor", "CGColorSpace", "CGDirectDisplay", "CGError", "CGPath"] }
objc2-core-text = { workspace = true, features = ["CTFont", "CTFontDescriptor", "CTLine", "CTStringAttributes", "objc2-core-graphics"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
