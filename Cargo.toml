[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/auscyber/rsbar"

[workspace.dependencies]
rsbar-protocol = { path = "crates/protocol" }
skylight = { path = "crates/skylight" }

async-mach-ports = "0.1"
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
# `debug` names the system and the components in a B0001 access-conflict
# panic. Without it the message is six copies of "Enable the debug feature to
# see the name", which is a bad afternoon.
bevy_ecs = { version = "0.19", default-features = false, features = ["std", "debug"] }
bevy_time = { version = "0.19", default-features = false, features = ["std"] }
bitflags = "2.13"
futures-lite = "2.6"
notify = "8"
libc = "0.2"
objc2 = { version = "0.6", features = ["catch-all", "exception"] }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-core-text = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-quartz-core = { version = "0.3", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# The `sync` feature alone: channels and locks work with no runtime, which
# matters because this daemon deliberately has none — its executor is the
# CFRunLoop-driven Bevy runner.
tokio = { version = "1", default-features = false, features = ["sync"] }
thiserror = "2.0"
tracing = "0.1"

[workspace.lints.clippy]
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
